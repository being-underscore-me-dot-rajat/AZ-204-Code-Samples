<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Welcome</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 60px 50px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      animation: fadeIn 1.5s ease;
      max-width: 600px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    p {
      font-size: 1.2rem;
      opacity: 0.9;
      margin-bottom: 30px;
    }

    button {
      padding: 14px 32px;
      border: none;
      border-radius: 30px;
      background: white;
      color: #2575fc;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s ease;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: rgba(255,255,255,0.15);
      border-radius: 50%;
      filter: blur(120px);
      top: -100px;
      left: -100px;
    }

    .glow2 {
      bottom: -100px;
      right: -100px;
      top: auto;
      left: auto;
    }
  </style>
</head>
<body>

  <div class="glow"></div>
  <div class="glow glow2"></div>

  <div class="card">
    <h1>Welcome ✨</h1>
    <p>
      We’re so glad you’re here.  
      Explore, enjoy, and make yourself at home.
    </p>
    <button onclick="alert('Welcome aboard! 🚀')">Get Started</button>
  </div>

</body>
</html>
