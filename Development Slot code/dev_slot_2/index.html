<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Welcome</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Montserrat", sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #1a1a1a, #050505);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e0e0e0;
      overflow: hidden;
    }

    .card {
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(8px);
      border-radius: 18px;
      padding: 60px 50px;
      text-align: center;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
      animation: fadeIn 1.5s ease;
      max-width: 600px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 15px;
      letter-spacing: 2px;
    }

    p {
      font-size: 1.1rem;
      opacity: 0.8;
      margin-bottom: 30px;
    }

    button {
      padding: 14px 32px;
      border: 1px solid #444;
      border-radius: 30px;
      background: transparent;
      color: #ccc;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s ease;
    }

    button:hover {
      background: #111;
      box-shadow: 0 0 20px rgba(255,255,255,0.1);
      transform: translateY(-2px);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fog {
      position: absolute;
      width: 600px;
      height: 600px;
      background: rgba(255,255,255,0.03);
      border-radius: 50%;
      filter: blur(150px);
      top: -200px;
      left: -200px;
    }

    .fog2 {
      bottom: -200px;
      right: -200px;
      top: auto;
      left: auto;
    }
  </style>
</head>
<body>

  <div class="fog"></div>
  <div class="fog fog2"></div>

  <div class="card">
    <h1>Welcome</h1>
    <p>
      You have entered the unknown.  
      Tread carefully… and explore.
    </p>
    <button onclick="alert('You are not alone here… 👁️')">Enter</button>
  </div>

</body>
</html>
